<!DOCTYPE html>
<html lang="zh-CN" class="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>KOReader 阅读记录看板</title>

  <!-- 外部依赖（CDN，无需构建步骤） -->
  <script src="https://cdn.tailwindcss.com"></script>
  <script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
  <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/prop-types/15.8.1/prop-types.min.js"></script>
  <script src="https://unpkg.com/recharts@2.12.7/umd/Recharts.js"></script>

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap">
  <link rel="stylesheet" href="./styles.css">
</head>
<body class="bg-slate-950 text-slate-100 min-h-screen antialiased selection:bg-emerald-500 selection:text-white">

  <div id="root"></div>

  <!--
    应用代码：由浏览器内的 Babel 编译，按依赖顺序执行。
    setup.js 必须最前（提供全局常量），main.jsx 必须最后（挂载 React）。
    注意：需通过 HTTP 访问（如 VS Code Live Server），直接双击打开 file:// 会被 CORS 拦截。
  -->
  <script type="text/babel" src="./js/setup.js"></script>
  <script type="text/babel" src="./js/useReadingData.js"></script>

  <script type="text/babel" src="./js/components/Card.jsx"></script>
  <script type="text/babel" src="./js/components/StatusScreen.jsx"></script>
  <script type="text/babel" src="./js/components/DashboardHeader.jsx"></script>
  <script type="text/babel" src="./js/components/PeriodTabs.jsx"></script>
  <script type="text/babel" src="./js/components/MetricsGrid.jsx"></script>
  <script type="text/babel" src="./js/components/HeatmapCard.jsx"></script>
  <script type="text/babel" src="./js/components/WeeklyReportCard.jsx"></script>
  <script type="text/babel" src="./js/components/HourlyDistributionCard.jsx"></script>
  <script type="text/babel" src="./js/components/TopBooksCard.jsx"></script>
  <script type="text/babel" src="./js/components/BookProgressCard.jsx"></script>

  <script type="text/babel" src="./js/App.jsx"></script>
  <script type="text/babel" src="./js/main.jsx"></script>
</body>
</html>
