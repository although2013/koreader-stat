<!DOCTYPE html>
<html lang="zh-CN" class="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>KOReader 阅读记录看板</title>
  
  <!-- 1. Tailwind CSS -->
  <script src="https://cdn.tailwindcss.com"></script>

  <!-- 2. React & ReactDOM -->
  <script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
  <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
  
  <!-- 3. Babel -->
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>

  <!-- 4. PropTypes -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/prop-types/15.8.1/prop-types.min.js"></script>

  <!-- 5. Recharts -->
  <script src="https://unpkg.com/recharts@2.12.7/umd/Recharts.js"></script>

  <style>
    @import url('https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap');
    body {
      font-family: 'Inter', system-ui, -apple-system, sans-serif;
    }
    .glass-card {
      background: rgba(15, 23, 42, 0.75);
      backdrop-filter: blur(12px);
      border: 1px solid rgba(255, 255, 255, 0.08);
    }
  </style>
</head>
<body class="bg-slate-950 text-slate-100 min-h-screen antialiased selection:bg-emerald-500 selection:text-white">

  <div id="root"></div>

  <script type="text/babel">
    const { useState, useEffect, useMemo } = React;
    const { 
      AreaChart, Area, BarChart, Bar, XAxis, YAxis, Tooltip, ResponsiveContainer, Cell 
    } = window.Recharts;

    // 单行 Y 轴刻度
    const CustomYAxisTick = ({ x, y, payload }) => {
      const title = payload.value || '';
      const formattedTitle = title.length > 7 ? `${title.substring(0, 7)}...` : title;

      return (
        <g transform={`translate(${x},${y})`}>
          <text x={-8} y={4} textAnchor="end" fill="#cbd5e1" fontSize={12} fontWeight={500}>
            {formattedTitle}
          </text>
        </g>
      );
    };

    // 🌟 新增：GitHub 风格阅读热力图组件
    function HeatmapCard({ heatmapData = {} }) {
      const days = useMemo(() => {
        const result = [];
        const today = new Date();
        // 生成过去 365 天的连续日期数组
        for (let i = 364; i >= 0; i--) {
          const d = new Date();
          d.setDate(today.getDate() - i);
          const dateStr = d.toISOString().split('T')[0];
          const minutes = heatmapData[dateStr] || 0;
          result.push({ date: dateStr, minutes });
        }
        return result;
      }, [heatmapData]);

      // 获取特定梯度的绿颜色
      const getColorClass = (minutes) => {
        if (minutes === 0) return 'bg-slate-800/50 hover:border-slate-600';
        if (minutes < 15) return 'bg-emerald-950 border-emerald-800/50 hover:border-emerald-400';
        if (minutes < 45) return 'bg-emerald-800 border-emerald-600/50 hover:border-emerald-300';
        if (minutes < 90) return 'bg-emerald-600 border-emerald-400/50 hover:border-emerald-200';
        return 'bg-emerald-400 border-emerald-200 shadow-sm shadow-emerald-500/50 hover:border-white';
      };

      return (
        <div className="glass-card p-6 rounded-2xl border border-slate-800 space-y-3">
          <div className="flex justify-between items-center">
            <h2 className="text-base font-semibold text-slate-200 flex items-center gap-2">
              <span>📅</span> 过去 365 天阅读热力图 (Contribution)
            </h2>
            <div className="flex items-center gap-1.5 text-xs text-slate-400">
              <span>Less</span>
              <span className="w-2.5 h-2.5 rounded-sm bg-slate-800/50"></span>
              <span className="w-2.5 h-2.5 rounded-sm bg-emerald-950"></span>
              <span className="w-2.5 h-2.5 rounded-sm bg-emerald-800"></span>
              <span className="w-2.5 h-2.5 rounded-sm bg-emerald-600"></span>
              <span className="w-2.5 h-2.5 rounded-sm bg-emerald-400"></span>
              <span>More</span>
            </div>
          </div>

          {/* 网格容器：按 7 行（周一至周日）排布 */}
          <div className="overflow-x-auto pb-2">
            <div className="grid grid-rows-7 grid-flow-col gap-1.5 min-w-[720px]">
              {days.map((day) => (
                <div
                  key={day.date}
                  title={`${day.date}: ${day.minutes ? `${day.minutes} 分钟` : '无阅读记录'}`}
                  className={`w-3 h-3 rounded-sm border border-transparent transition-all cursor-pointer ${getColorClass(day.minutes)}`}
                />
              ))}
            </div>
          </div>
        </div>
      );
    }

    function App() {
      const [data, setData] = useState(null);
      const [error, setError] = useState(null);

      useEffect(() => {
        fetch('/reading_data.json')
          .then(res => {
            if (!res.ok) throw new Error(`HTTP 错误! 状态码: ${res.status}`);
            return res.json();
          })
          .then(jsonData => setData(jsonData))
          .catch(err => {
            console.error("加载数据失败:", err);
            setError(err.message);
          });
      }, []);

      if (error) {
        return (
          <div className="flex flex-col items-center justify-center min-h-screen text-rose-400 gap-2">
            <p className="text-lg font-semibold">⚠️ 数据加载失败</p>
            <p className="text-sm text-slate-500">{error}</p>
          </div>
        );
      }

      if (!data) {
        return (
          <div className="flex justify-center items-center min-h-screen text-slate-400">
            <div className="flex items-center gap-3">
              <span className="animate-spin text-xl">⏳</span>
              <span>正在读取阅读记录数据...</span>
            </div>
          </div>
        );
      }

      return (
        <div className="max-w-6xl mx-auto px-4 py-8 space-y-8">
          {/* Header 页头 */}
          <header className="flex flex-col md:flex-row justify-between items-start md:items-center glass-card p-6 rounded-2xl border border-slate-800 gap-4">
            <div>
              <div className="flex items-center gap-3">
                <span className="text-3xl">📖</span>
                <h1 className="text-2xl font-bold bg-clip-text text-transparent bg-gradient-to-r from-emerald-400 via-teal-300 to-cyan-400">
                  KOReader 阅读深度看板
                </h1>
              </div>
              <p className="text-xs text-slate-400 mt-2 flex flex-wrap items-center gap-2">
                <span>⏱️ 统计周期：{data.period.start} ~ {data.period.end} ({data.period.totalDays} 天)</span>
                <span>•</span>
                <span>更新时间：{data.period.updatedAt}</span>
              </p>
            </div>

            <div className="flex items-center gap-3 bg-emerald-950/40 border border-emerald-500/20 px-4 py-2.5 rounded-xl text-emerald-400 text-sm self-stretch md:self-auto justify-between md:justify-start">
              <div>
                <p className="text-xs text-slate-400">最近在读</p>
                <p className="font-semibold text-slate-200">《{data.recent.title}》</p>
              </div>
              <span className="text-xs text-slate-400 ml-2">{data.recent.time?.split(' ')[1] || ''}</span>
            </div>
          </header>

          {/* 核心指标卡片 Grid */}
          <div className="grid grid-cols-2 sm:grid-cols-4 gap-4">
            <MetricCard title="总阅读时长" value={`${data.overall.totalHours}h`} sub={`${data.overall.totalMinutes || Math.round(data.overall.totalHours * 60)} 分钟`} icon="⏱️" />
            <MetricCard title="总翻页数" value={data.overall.totalPages.toLocaleString()} sub={`${data.overall.avgSpeedPph} 页/小时`} icon="📄" />
            <MetricCard title="打卡 Streak" value={`${data.overall.currentStreak} 天`} sub={`最高: ${data.overall.maxStreak} 天`} icon="🔥" />
            <MetricCard title="夜猫子指数" value={`${data.overall.nightOwlRatio}%`} sub="00:00 - 06:00 时段" icon="🌙" />
            <MetricCard title="阅读会话" value={`${data.overall.totalSessions} 次`} sub={`均单次 ${data.overall.avgSessionMin}min`} icon="🎯" />
            <MetricCard title="活跃书目" value={`${data.overall.activeBooks} 本`} sub="已产生阅读时长" icon="📚" />
            <MetricCard title="划线与标注" value={`${data.overall.totalHighlights} 处`} sub="累计笔记" icon="✏️" />
            <MetricCard title="翻页效率" value={`${data.overall.avgSecPerPage}s`} sub="平均每页耗时" icon="⚡" />
          </div>

          {/* 🌟 1. 阅读热力图 (GitHub Contribution Heatmap) */}
          <HeatmapCard heatmapData={data.heatmap} />

          {/* 可视化图表区域 */}
          <div className="grid lg:grid-cols-2 gap-6">
            
            {/* 图表 1: 24 小时阅读时段分布 */}
            <div className="glass-card p-6 rounded-2xl border border-slate-800">
              <h2 className="text-base font-semibold mb-4 text-slate-200 flex items-center gap-2">
                <span>🌙</span> 24 小时阅读时段分布 (时长/小时)
              </h2>
              <div className="h-64 w-full">
                <ResponsiveContainer width="100%" height="100%">
                  <AreaChart data={data.timeDistribution}>
                    <defs>
                      <linearGradient id="colorHours" x1="0" y1="0" x2="0" y2="1">
                        <stop offset="5%" stopColor="#10b981" stopOpacity={0.4}/>
                        <stop offset="95%" stopColor="#10b981" stopOpacity={0.0}/>
                      </linearGradient>
                    </defs>
                    <XAxis dataKey="hour" stroke="#64748b" fontSize={12} />
                    <YAxis stroke="#64748b" fontSize={12} />
                    <Tooltip 
                      contentStyle={{ backgroundColor: '#0f172a', borderColor: '#334155', borderRadius: '0.75rem', color: '#f8fafc', boxShadow: '0 10px 15px -3px rgba(0,0,0,0.5)' }}
                      itemStyle={{ color: '#38bdf8', fontWeight: 600 }}
                      labelStyle={{ color: '#94a3b8', marginBottom: '4px' }}
                      formatter={(val) => [`${val} 小时`, '阅读时间']}
                    />
                    <Area type="monotone" dataKey="hours" stroke="#10b981" strokeWidth={2.5} fillOpacity={1} fill="url(#colorHours)" />
                  </AreaChart>
                </ResponsiveContainer>
              </div>
            </div>

            {/* 图表 2: 横向柱状图 - 各图书投入时长对比 */}
            <div className="glass-card p-6 rounded-2xl border border-slate-800">
              <h2 className="text-base font-semibold mb-4 text-slate-200 flex items-center gap-2">
                <span>📊</span> 核心图书投入时长对比 (小时)
              </h2>
              <div className="h-64 w-full">
                <ResponsiveContainer width="100%" height="100%">
                  <BarChart
                    layout="vertical"
                    data={data.books.slice(0, 5)}
                    margin={{ top: 5, right: 30, left: 10, bottom: 5 }}
                  >
                    <XAxis type="number" stroke="#64748b" fontSize={12} unit="h" />
                    <YAxis 
                      type="category" 
                      dataKey="title" 
                      stroke="#94a3b8" 
                      width={100}
                      tick={<CustomYAxisTick />}
                    />
                    <Tooltip 
                      cursor={{ fill: 'rgba(16, 185, 129, 0.08)' }}
                      contentStyle={{ backgroundColor: '#0f172a', borderColor: '#334155', borderRadius: '0.75rem', color: '#f8fafc', boxShadow: '0 10px 15px -3px rgba(0,0,0,0.5)' }}
                      itemStyle={{ color: '#5eead4', fontWeight: 600 }}
                      labelStyle={{ color: '#f8fafc', fontWeight: 600, marginBottom: '4px' }}
                      formatter={(val) => [`${val} 小时`, '累计时长']}
                    />
                    <Bar dataKey="hours" radius={[0, 6, 6, 0]} barSize={18}>
                      {data.books.slice(0, 5).map((entry, index) => (
                        <Cell 
                          key={index} 
                          fill={
                            index === 0 ? '#10b981' : 
                            index === 1 ? '#06b6d4' : 
                            index === 2 ? '#6366f1' : 
                            index === 3 ? '#ec4899' : '#f59e0b'
                          } 
                        />
                      ))}
                    </Bar>
                  </BarChart>
                </ResponsiveContainer>
              </div>
            </div>

          </div>

          {/* 图书阅读进度 & 智能 ETA 预测 */}
          <div className="glass-card p-6 rounded-2xl border border-slate-800 space-y-4">
            <div className="flex items-center justify-between">
              <h2 className="text-base font-semibold text-slate-200 flex items-center gap-2">
                <span>🏆</span> 研读图书进度与预估 ETA
              </h2>
              <span className="text-xs text-slate-500">根据 PPH 自动预测</span>
            </div>

            <div className="space-y-3">
              {data.books.map((book) => (
                <div key={book.rank} className="p-4 rounded-xl bg-slate-900/40 border border-slate-800/80 hover:bg-emerald-950/30 hover:border-emerald-500/30 hover:shadow-lg transition-all duration-200 flex flex-col sm:flex-row justify-between items-start sm:items-center gap-3 group">
                  <div className="space-y-1">
                    <div className="flex items-center gap-2">
                      <span className="text-sm font-bold text-slate-400 group-hover:text-emerald-400 transition-colors">{book.medal}</span>
                      <span className="font-semibold text-slate-100 group-hover:text-emerald-300 transition-colors">{book.title}</span>
                    </div>
                    <p className="text-xs text-slate-400">已读 {book.duration} · 标注 {book.highlights} 处</p>
                  </div>

                  <div className="flex items-center gap-3 w-full sm:w-auto justify-between sm:justify-end">
                    <div className="flex items-center gap-2">
                      <div className="w-24 bg-slate-800 h-2 rounded-full overflow-hidden">
                        <div 
                          className="bg-gradient-to-r from-teal-500 to-emerald-400 h-full rounded-full transition-all duration-500" 
                          style={{ width: `${book.progress}%` }}
                        />
                      </div>
                      <span className="text-xs font-mono text-slate-300 w-10 text-right">{book.progress}%</span>
                    </div>

                    <span className={`text-xs px-2.5 py-1 rounded-full font-medium border ${
                      book.status === 'finished' 
                        ? 'bg-emerald-500/10 text-emerald-400 border-emerald-500/20' 
                        : 'bg-amber-500/10 text-amber-400 border-amber-500/20'
                    }`}>
                      {book.status === 'finished' ? '已完成' : `还需 ${book.eta}`}
                    </span>
                  </div>
                </div>
              ))}
            </div>
          </div>

        </div>
      );
    }

    function MetricCard({ title, value, sub, icon }) {
      return (
        <div className="glass-card p-4 rounded-xl border border-slate-800/80 flex flex-col justify-between hover:border-slate-700 hover:bg-slate-900/90 transition-all">
          <div className="flex justify-between text-xs text-slate-400">
            <span>{title}</span>
            <span>{icon}</span>
          </div>
          <div className="mt-2">
            <div className="text-xl font-bold text-slate-100 tracking-tight">{value}</div>
            <div className="text-[11px] text-slate-400 mt-0.5">{sub}</div>
          </div>
        </div>
      );
    }

    ReactDOM.createRoot(document.getElementById('root')).render(<App />);
  </script>
</body>
</html>
