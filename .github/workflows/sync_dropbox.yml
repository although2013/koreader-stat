name: 🔄 自动获取 Dropbox 数据库并更新 README

on:
  schedule:
    # UTC 时间每日凌晨 0:00 (相当于北京时间早上 8:00) 自动触发
    - cron: '0 0 * * *'
  workflow_dispatch: # 允许在 GitHub 页面手动点击按钮随时运行

jobs:
  sync_and_update:
    runs-on: ubuntu-latest

    permissions:
      contents: write # 给 Actions 赋予向仓库提交代码的权限

    steps:
      - name: 1. 检出代码
        uses: actions/checkout@v4

      - name: 2. 设置 Python 环境
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: 3. 安装依赖库
        run: |
          python -m pip install --upgrade pip
          pip install pandas numpy

      - name: 4. 从 Dropbox 下载最新 sqlite 文件
        run: |
          curl -L -o statistics.sqlite3 "${{ secrets.DROPBOX_FILE_URL }}"

      - name: 5. 运行 Python 脚本更新 README
        run: |
          python update_readme.py

      - name: 6. 自动提交并 Push README 到仓库
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: "🤖 自动同步: 更新 KOReader 阅读统计看板"
          branch: ${{ github.ref_name }}
          file_pattern: 'README.md'