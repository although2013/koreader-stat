name: 🔄 自动获取 Dropbox 数据库并部署阅读看板

on:
  schedule:
    # UTC 时间每日凌晨 0:00 (北京时间早上 8:00) 自动触发
    - cron: '0 0 * * *'
  workflow_dispatch: # 允许手动点击按钮随时运行

jobs:
  sync_and_deploy:
    runs-on: ubuntu-latest

    steps:
      - name: 1. 检出代码
        uses: actions/checkout@v4

      - name: 2. 设置 Python 环境
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: 3. 安装 Python 依赖库
        run: |
          python -m pip install --upgrade pip
          pip install pandas numpy

      - name: 4. 从 Dropbox 下载最新 sqlite 文件
        run: |
          curl -L -o statistics.sqlite3 "${{ secrets.DROPBOX_FILE_URL }}"

      - name: 5. 运行 Python 脚本生成 JSON 数据
        run: |
          python export_stats.py

      - name: 6. 自动部署到 Cloudflare Pages
        uses: cloudflare/pages-action@v1
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          projectName: 'koreader-stat'  # 替换为你在 Cloudflare 创建的项目名称
          directory: 'public'                 # 部署 public 文件夹
          gitHubToken: ${{ secrets.GITHUB_TOKEN }}
