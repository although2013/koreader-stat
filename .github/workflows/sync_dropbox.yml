name: 🔄 自动获取 Dropbox 数据库并更新阅读数据 JSON

on:
  schedule:
    # cron 只认 UTC。东京时间 = UTC + 9，故 UTC 时刻 = 目标 JST 时刻 - 9 小时。
    # 刻意避开整点：GitHub 的 schedule 是共享队列，整点（尤其 UTC 00:00）最拥堵，
    # 之前用 '0 0 * * *' 实测被延迟了约 3 小时。
    # 注：数据的日界线由 export_stats.py 的 TZ_OFFSET_HOURS 决定，与本 cron 时刻无关。
    - cron: '45 21 * * *'  # UTC 21:45 (前一日) = JST 次日 06:45 早上
    - cron: '45 11 * * *'  # UTC 11:45          = JST 同日 20:45 晚上
  workflow_dispatch: # 允许在 GitHub 页面手动点击按钮随时运行

jobs:
  sync_and_update:
    runs-on: ubuntu-latest

    permissions:
      contents: write # 赋予 Actions 向仓库 Commit 和 Push 的权限

    steps:
      - name: 1. 检出代码
        uses: actions/checkout@v4

      - name: 2. 设置 Python 环境
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: 3. 安装 Python 依赖库
        run: |
          python -m pip install --upgrade pip
          pip install pandas numpy

      - name: 4. 从 Dropbox 下载最新 sqlite 文件
        run: |
          curl -L -o statistics.sqlite3 "${{ secrets.DROPBOX_FILE_URL }}"

      - name: 5. 运行 Python 脚本生成 JSON 数据
        run: |
          python export_stats.py

      - name: 6. 自动提交并 Push reading_data.json 到仓库
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: "🤖 自动同步: 更新 KOReader 阅读数据 JSON"
          branch: ${{ github.ref_name }}
          file_pattern: 'public/reading_data.json'
